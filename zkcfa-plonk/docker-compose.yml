services:
  plonk-dev:
    build: .
    image: zkcfa-plonk-dev
    container_name: zkcfa-plonk
    init: true
    volumes:
      # Repository mounted at /data; the Rust crate is /data/zkcfa.
      - .:/data
      # Persist crate downloads across container recreation
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    working_dir: /data/zkcfa
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:
