[package]
name = "zkcfa"
version = "0.2.0"
edition = "2021"
default-run = "zkcfa"
description = "Poseidon/PLONK backend for the raw-address zkCFA relation"
license = "MIT OR Apache-2.0"

[features]
default = []
# Opt in to synthetic measurements; signed proving and reissuance remain default tools.
experiments = []

[[example]]
name = "scaling"
required-features = ["experiments"]

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
hex = "0.4"
libc = "0.2"
plonk-core = { path = "../plonk/plonk-core", default-features = true }
plonk-hashing = { path = "../plonk/plonk-hashing" }
ark-bls12-381 = "0.3"
ark-ed-on-bls12-381 = "0.3"
ark-ec = "0.3"
ark-ff = "0.3"
ark-poly = "0.3"
ark-poly-commit = "0.3"
ark-serialize = "0.3"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
